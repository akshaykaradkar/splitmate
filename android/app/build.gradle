plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'org.jetbrains.kotlin.plugin.compose'
    id 'com.google.devtools.ksp'
}

android {
    namespace 'com.splitmate.app'
    compileSdk 36

    defaultConfig {
        applicationId "com.splitmate.app"
        minSdk 26
        targetSdk 34
        versionCode 54
        versionName "2.3.5.1"
        resConfigs "en"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.debug
        }
        debug {
            applicationIdSuffix ".debug"
        }
    }

    applicationVariants.all { variant ->
        variant.outputs.all {
            outputFileName = "splitmate-${variant.versionName}.apk"
        }
    }

    buildFeatures {
        compose true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
        freeCompilerArgs += ["-opt-in=com.splitmate.app.ui.components.ExperimentalMaterial3ExpressiveApi", "-opt-in=androidx.compose.material3.ExperimentalMaterial3ExpressiveApi"]
    }

    testOptions {
        unitTests.all {
            useJUnitPlatform()
            // v2.3.6: Robolectric/Roborazzi screenshots of the real app UI are opt-in:
            //   gradle testDebugUnitTest -Psplitmate.screenshots=true --tests '*ScreenshotTest*'
            systemProperty 'splitmate.screenshots', project.findProperty('splitmate.screenshots') ?: 'false'
            systemProperty 'roborazzi.test.record', project.findProperty('splitmate.screenshots') ?: 'false'
            systemProperty 'splitmate.screenshots.dir', project.findProperty('splitmate.screenshots.dir') ?: "${buildDir}/screenshots"
            maxHeapSize = '4g'
        }
        unitTests.returnDefaultValues = true
        unitTests.includeAndroidResources = true
    }
}

dependencies {
    def composeBom = platform('androidx.compose:compose-bom:2026.03.01')
    implementation composeBom
    androidTestImplementation composeBom

    // Native Jetpack Compose & Material 3 Expressive + Jetpack Navigation Compose + Google Fonts
    implementation 'androidx.core:core-ktx:1.12.0'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.7.0'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-compose:2.7.0'
    implementation 'androidx.lifecycle:lifecycle-runtime-compose:2.7.0'
    implementation 'androidx.activity:activity-compose:1.8.2'
    implementation 'androidx.navigation:navigation-compose:2.7.7'
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.ui:ui-graphics'
    implementation 'androidx.compose.ui:ui-tooling-preview'
    implementation 'androidx.compose.ui:ui-text-google-fonts'
    implementation 'androidx.compose.material3:material3:1.5.0-alpha14'
    implementation 'androidx.compose.material:material-icons-extended'
    implementation 'androidx.graphics:graphics-shapes:1.0.1'

    // Jetpack Room (Offline-First Relational Vault)
    def roomVersion = "2.7.2"
    implementation "androidx.room:room-runtime:$roomVersion"
    implementation "androidx.room:room-ktx:$roomVersion"
    ksp "androidx.room:room-compiler:$roomVersion"

    // OkHttp for Coil SVG network caching
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'

    // Coil + Coil-SVG (Dynamic DiceBear SVG Avatar Decoding & Indefinite Disk Cache)
    implementation 'io.coil-kt:coil-compose:2.6.0'
    implementation 'io.coil-kt:coil-svg:2.6.0'

    // ZXing Core for instant offline UPI QR Code Decoding from Gallery/Screenshots (<10ms)
    implementation 'com.google.zxing:core:3.5.3'

    // Jetpack Security Crypto (AES256-GCM Hardware-Backed Keystore for PNR Vault)
    implementation 'androidx.security:security-crypto:1.1.0-alpha06'

    // Google Play Services Identity (Zero-Permission OS Hardware SIM PhoneNumberHint Verification)
    implementation 'com.google.android.gms:play-services-auth:21.0.0'

    // QA & Automated Testing: JUnit 5, CashApp Turbine, Coroutines Test, Compose Test Rule
    testImplementation 'org.junit.jupiter:junit-jupiter-api:5.10.2'
    testRuntimeOnly 'org.junit.jupiter:junit-jupiter-engine:5.10.2'
    testImplementation 'org.junit.jupiter:junit-jupiter-params:5.10.2'
    testImplementation 'app.cash.turbine:turbine:1.1.0'
    testImplementation 'org.jetbrains.kotlinx:kotlinx-coroutines-test:1.8.0'
    testImplementation 'org.json:json:20231013'
    testImplementation 'junit:junit:4.13.2'
    // v2.3.6: JVM screenshots of the real Compose UI (no device needed)
    testRuntimeOnly 'org.junit.vintage:junit-vintage-engine:5.10.2'
    testImplementation 'org.robolectric:robolectric:4.16'
    testImplementation 'io.github.takahirom.roborazzi:roborazzi:1.50.0'
    testImplementation 'io.github.takahirom.roborazzi:roborazzi-compose:1.50.0'
    testImplementation 'androidx.compose.ui:ui-test-junit4'
    androidTestImplementation 'androidx.compose.ui:ui-test-junit4'
    debugImplementation 'androidx.compose.ui:ui-test-manifest'
}
