<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"/>
  <title>SplitMate</title>

  <!-- Offline Fonts & Material Symbols Outlined -->
  <link rel="stylesheet" href="vendor/fonts.css"/>

  <!-- All 4 Official Google Design Systems + SplitMate Unified Token Bindings -->
  <link rel="stylesheet" href="design_systems/google-material-3/design-system-bindings.css"/>
  <link rel="stylesheet" href="design_systems/android-motion/design-system-bindings.css"/>
  <link rel="stylesheet" href="design_systems/elements-3/design-system-bindings.css"/>
  <link rel="stylesheet" href="design_systems/android-pixel-design-system/design-system-bindings.css"/>
  <link rel="stylesheet" href="design_systems/splitmate-unified-bindings.css"/>

  <!-- Offline Tailwind CSS Engine -->
  <script src="vendor/tailwindcss.js"></script>

  <style>
    :root {
      --sm-canvas: #FAF6F0;
      --sm-charcoal: #23201E;
      --sm-easing: var(--droid-sys-motion-easing-emphasized-decelerate, cubic-bezier(0.05, 0.7, 0.1, 1));
      --sm-spring: cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      min-height: 100dvh;
      background-color: var(--sm-canvas);
      color: var(--sm-charcoal);
      font-family: 'Plus Jakarta Sans', sans-serif;
      overscroll-behavior-y: none;
    }

    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { scrollbar-width: none; }

    @keyframes slideUpModal {
      from {
        opacity: 0;
        transform: translateY(44px) scale(0.97);
      }
      to {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }

    .animate-slide-up {
      animation: slideUpModal 340ms var(--sm-easing) forwards;
    }

    button, select {
      transition: transform 200ms var(--sm-spring), background-color 180ms ease, border-color 180ms ease;
    }
    button:active {
      transform: scale(0.96);
    }
  </style>
</head>
<body class="bg-[#FAF6F0] text-[#23201E] flex flex-col min-h-screen">

  <!-- Sticky App Header -->
  <header id="app-header" class="sticky top-0 z-40 bg-[#FAF6F0]/92 backdrop-blur-md border-b border-[#EDE7DF]/80 max-w-md mx-auto w-full"></header>

  <!-- Main Reactive Content Container -->
  <main id="app-main" class="flex-1 w-full max-w-md mx-auto px-5 pt-4 pb-24"></main>

  <!-- Docked Bottom Navigation Bar -->
  <nav id="app-bottom-nav" class="fixed bottom-0 left-0 right-0 z-40 bg-[#FAF6F0]/95 backdrop-blur-xl border-t border-[#EDE7DF]"></nav>

  <!-- Modal Root Container -->
  <div id="app-modal-root"></div>

  <!-- Dynamic Application Engine Scripts -->
  <script src="splitmate-app.js"></script>
  <script src="splitmate-ui.js"></script>
  <script src="splitmate-tabs.js"></script>
  <script src="splitmate-modals.js"></script>
  <script>
    window.addEventListener('DOMContentLoaded', async () => {
      loadState();
      await initCurrencies();
      renderApp();
      // Open Profile & Currency Setup automatically on very first launch
      if (!STATE.onboarded) {
        openProfileModal();
      }
    });

    window.handleAndroidBack = function () {
      const modalRoot = document.getElementById('app-modal-root');
      if (modalRoot && modalRoot.innerHTML.trim() !== '') {
        if (STATE.onboarded) {
          closeModal();
          return true;
        }
      }
      if (STATE.activeTab !== 'groups') {
        switchTab('groups');
        return true;
      }
      return false;
    };
  </script>
</body>
</html>
