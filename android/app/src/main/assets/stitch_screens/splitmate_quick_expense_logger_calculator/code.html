<script>
  // Simple interactive tactile feedback for quick chips and keypad
  const display = document.getElementById('keypad-display');
  const numButtons = document.querySelectorAll('.grid button');

  numButtons.forEach((btn) => {
    btn.addEventListener('click', () => {
      const char = btn.innerText.trim();
      if (!display) return;
      
      if (btn.querySelector('.material-symbols-outlined')) {
        // Backspace
        if (display.textContent.length > 1) {
          display.textContent = display.textContent.slice(0, -1);
        } else {
          display.textContent = '0';
        }
      } else if (char && char.length === 1) {
        if (display.textContent === '0' && char !== '.') {
          display.textContent = char;
        } else if (char === '.' && display.textContent.includes('.')) {
          // Ignore multiple decimals
        } else if (display.textContent.length < 8) {
          display.textContent += char;
        }
      }
    });
  });
</script></main><script src="../../stitch-interactive.js"></script>
