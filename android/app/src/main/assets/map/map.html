<!DOCTYPE html>
<!-- v2.4.0 rc15: SplitMate Loop map host. Loaded from file:///android_asset/map/ inside a WebView.
     Only bundled scripts run here; the style, colours and loop data all come from Kotlin. -->
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; worker-src blob:; child-src blob:; connect-src https://tiles.openfreemap.org;">
  <link rel="stylesheet" href="maplibre-gl.css">
  <style>
    html, body, #map { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: transparent; }
    .maplibregl-ctrl-attrib, .maplibregl-ctrl-logo { display: none !important; } /* credit is a Compose chip */
  </style>
</head>
<body>
  <div id="map" role="img" aria-label="Map of the loop"></div>
  <script src="maplibre-gl.js"></script>
  <script src="loop_map.js"></script>
</body>
</html>
